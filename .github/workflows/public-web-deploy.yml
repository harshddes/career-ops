name: Public web deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cursor/zero-cost-public-saas-0a19
    paths:
      - 'apps/web/**'
      - '.github/workflows/public-web-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Migrate Neon schema
        working-directory: apps/web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm install
          node scripts/migrate.mjs
      - name: Compact catalog ingest
        working-directory: apps/web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true
        run: npm run catalog:ingest -- --sources=euraxess
      - name: Deploy Cloudflare Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CATALOG_SERVICE_KEY: ${{ secrets.CATALOG_SERVICE_KEY }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: node scripts/deploy-cloudflare.mjs
